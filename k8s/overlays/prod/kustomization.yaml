apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

resources:
  - ../../base

# In cd.yml, `kustomize edit set image` updates newTag to ${{ github.sha }} (never :latest).
images:
  - name: rahbar-api
    newName: docker.io/hassanzahid110/rahbar-api
    newTag: v0.1.0
  - name: rahbar-indexer
    newName: docker.io/hassanzahid110/rahbar-indexer
    newTag: v0.1.0
  - name: rahbar-ui
    newName: docker.io/hassanzahid110/rahbar-ui
    newTag: v0.1.0

patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "INFO"

