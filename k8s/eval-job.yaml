apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-gate-config
  namespace: rahbar
data:
  GATE_MAX_RECALL5_DROP: "0.02"
  GATE_MIN_RECALL5_ABSOLUTE: "0.88"
  GATE_MIN_FAITHFULNESS: "0.85"
  GATE_MIN_ABSTENTION: "1.00"
  GATE_MIN_CITATION_VALIDITY: "0.80"
  GATE_MAX_P95_LATENCY_MS: "2500.0"
  CANDIDATE_MODE: "pass"
  CANDIDATE_EMBED_MODEL: "hybrid-512"
  CANDIDATE_CHUNK_SIZE: "250"
  CANDIDATE_CHUNK_OVERLAP: "50"
  CANDIDATE_TOP_K: "5"
  CANDIDATE_RELEVANCE_FLOOR: "0.26"
  CANDIDATE_RERANKER: "true"
  EVAL_RESULTS_DIR: "/data/eval_results"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eval-gate
  namespace: rahbar
  labels:
    app: eval-gate
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: eval-gate
    spec:
      serviceAccountName: rahbar-indexer-sa
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eval-gate
          image: rahbar-api:ragops-v2
          imagePullPolicy: IfNotPresent
          command:
            - "python"
            - "-m"
            - "eval.release_gate"
            - "--eval-candidate-mode"
            - "env"
          envFrom:
            - configMapRef:
                name: rahbar-config
            - configMapRef:
                name: rahbar-gate-config
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: ragops-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ragops-data
          persistentVolumeClaim:
            claimName: ragops-data-pvc
        - name: tmp
          emptyDir: {}
