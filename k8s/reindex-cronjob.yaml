apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app: indexer
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: indexer
        spec:
          serviceAccountName: rahbar-indexer-sa
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              args:
                - "--verify"
                - "--batch-dir"
                - "/app/corpus/batch_a"
                - "--data-dir"
                - "/data"
              envFrom:
                - configMapRef:
                    name: rahbar-config
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "150m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1024Mi"
              volumeMounts:
                - name: ragops-data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: ragops-data
              persistentVolumeClaim:
                claimName: ragops-data-pvc
            - name: tmp
              emptyDir: {}
