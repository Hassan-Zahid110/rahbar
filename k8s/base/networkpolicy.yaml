# Default-deny ingress and egress for every pod in namespace rahbar (section 4.7)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow DNS resolution to kube-dns / CoreDNS in kube-system (section 9)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: rahbar
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# UI: reachable from Ingress controller on 8080; zero egress to chroma or redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8000
---
# API: reachable from Ingress and UI; may talk to chroma, redis, and host Ollama / HTTPS LLM
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: ui
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 443
---
# Chroma vector store: ONLY api (reader) and indexer (writer) may connect; ui is blocked
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chroma
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: chroma
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: indexer
      ports:
        - protocol: TCP
          port: 8000
---
# Redis semantic cache: ONLY api (cache lookup/store) and indexer (invalidation on re-index)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: indexer
      ports:
        - protocol: TCP
          port: 6379
---
# Indexer Job / CronJob: writes to chroma, invalidates redis, embeds via Ollama, fetches public corpus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-indexer
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: indexer
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: chroma
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

