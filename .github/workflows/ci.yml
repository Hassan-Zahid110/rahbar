name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: Ruff lint
        run: ruff check api indexer eval corpus
      - name: Mypy typecheck
        run: |
          cd api && mypy app
          cd ../indexer && mypy pipeline

  test:
    name: Unit Tests & Coverage (Stubs Only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - name: Run API tests with >= 60% coverage gate
        run: |
          cd api
          RETRIEVER=stub LLM_PROVIDER=stub pytest --cov=app --cov-fail-under=60 -q
      - name: Run Indexer tests
        run: |
          cd indexer
          pytest -q

  manifests:
    name: Validate Kustomize Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Validate prod, dev, and ci overlays
        run: |
          kustomize build k8s/overlays/prod | kubeconform -strict -summary
          kustomize build k8s/overlays/dev | kubeconform -strict -summary
          kustomize build k8s/overlays/ci | kubeconform -strict -summary

  build:
    name: Build Container Images (No Push on PR)
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api, indexer, and ui images tagged with commit SHA
        run: |
          docker build -t "rahbar-api:${{ github.sha }}" api
          docker build -t "rahbar-indexer:${{ github.sha }}" indexer
          docker build -t "rahbar-ui:${{ github.sha }}" ui

  scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - uses: actions/checkout@v4
      - name: Build images for scanning
        run: |
          docker build -t "rahbar-api:${{ github.sha }}" api
          docker build -t "rahbar-indexer:${{ github.sha }}" indexer
          docker build -t "rahbar-ui:${{ github.sha }}" ui
      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Scan api, indexer, and ui images (fail on fixable HIGH/CRITICAL)
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 "rahbar-api:${{ github.sha }}"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 "rahbar-indexer:${{ github.sha }}"
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 "rahbar-ui:${{ github.sha }}"

  e2e-eval:
    name: Ephemeral kind Cluster E2E & Eval Gate
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install eval runner dependencies
        run: pip install httpx==0.28.1 pyyaml==6.0.2
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Create ephemeral kind cluster with Ingress port mapping
        run: |
          cat <<'EOF' > /tmp/kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
          EOF
          kind create cluster --name rahbar-ci --config /tmp/kind-config.yaml
      - name: Install ingress-nginx for kind
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s
      - name: Build and load images into kind
        run: |
          docker build -t rahbar-api:ci api
          docker build -t rahbar-indexer:ci indexer
          docker build -t rahbar-ui:ci ui
          kind load docker-image rahbar-api:ci --name rahbar-ci
          kind load docker-image rahbar-indexer:ci --name rahbar-ci
          kind load docker-image rahbar-ui:ci --name rahbar-ci
          docker pull chromadb/chroma:1.0.12
          docker pull redis:7.4.2-alpine
          kind load docker-image chromadb/chroma:1.0.12 --name rahbar-ci
          kind load docker-image redis:7.4.2-alpine --name rahbar-ci
      - name: Deploy RAHBAR manifests and index fixture corpus
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl create configmap fixture-corpus -n rahbar \
            --from-file=eval/fixtures/academic-rules-2023.md \
            --from-file=eval/fixtures/academic-rules-2026.md \
            --from-file=eval/fixtures/fees-2026.md
          kubectl apply -k k8s/overlays/ci
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl rollout status deployment/redis -n rahbar --timeout=180s
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=180s
          kubectl rollout status deployment/api -n rahbar --timeout=180s
          kubectl rollout status deployment/ui -n rahbar --timeout=180s
      - name: Enforce Section 5.4 evaluation gate through Ingress
        run: |
          python eval/run_eval.py \
            --api http://127.0.0.1 \
            --host rahbar.local \
            --golden eval/fixtures/golden.fixture.yaml \
            --baseline eval/fixtures/baseline.fixture.json \
            --out /tmp/ci-eval-results.json
      - name: Dump pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,svc,ingress,jobs -n rahbar -o wide || true
          kubectl logs job/indexer -n rahbar || true
          kubectl logs -l app=api -n rahbar --tail=100 || true

